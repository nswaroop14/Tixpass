<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 380px; background: #f0f0f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #18181b; }
</style>
</head>
<body>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="380" style="background:#f0f0f3;">

  <!-- DARK HEADER -->
  <tr><td style="padding:20px 24px 16px;background:#1e1b4b;border-radius:20px 20px 0 0;text-align:center;">
    <img src="../cinema-connects-logo.jpeg" alt="Indian Cinema Connects" width="70" height="70" style="display:inline-block;border-radius:50%;" />
  </td></tr>

  <!-- WHITE CARD -->
  <tr><td style="background:#ffffff;padding:0 24px;">

    <!-- BOOKING CONFIRMED -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="padding:20px 0 16px;text-align:center;border-bottom:2px dashed #d4d4d8;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 auto;">
          <tr>
            <td valign="middle" style="padding-right:8px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr><td style="width:22px;height:22px;background:#16a34a;border-radius:50%;text-align:center;font-size:13px;color:#fff;font-weight:bold;line-height:22px;">&#10003;</td></tr>
              </table>
            </td>
            <td valign="middle" style="line-height:22px;"><span style="font-size:16px;font-weight:700;color:#16a34a;letter-spacing:1px;text-transform:uppercase;">Booking Confirmed</span></td>
          </tr>
        </table>
      </td></tr>
    </table>

    <!-- MOVIE INFO -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td width="110" valign="top" style="padding:18px 16px 18px 0;">
          <img src="https://m.media-amazon.com/images/M/MV5BMDkzYzdhOWItNjZiOS00MjdlLWE5ZGYtYWY1ZDllYmVlYjVjXkEyXkFqcGc@._V1_.jpg" alt="" style="width:110px;height:140px;object-fit:cover;border-radius:8px;display:block;" />
        </td>
        <td valign="top" style="padding:18px 0;">
          <div style="font-size:17px;font-weight:800;color:#18181b;line-height:1.3;margin-bottom:10px;">MIRZAPUR THE MOVIE</div>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#128197;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">4 September 2026</td></tr>
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#128336;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">9:45 PM</td></tr>
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#128205;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">K Cineplex, Limassol</td></tr>
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#128246;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">Screen 2</td></tr>
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#127916;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">Audio: Hindi</td></tr>
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#128172;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">Subtitles: English</td></tr>
            <tr><td style="padding:3px 0;font-size:13px;color:#52525b;vertical-align:top;width:22px;">&#127916;</td><td style="padding:3px 0;font-size:13px;color:#52525b;">General Admission</td></tr>
          </table>
        </td>
      </tr>
    </table>

    <!-- DIVIDER -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="border-top:2px dashed #d4d4d8;"></td></tr>
    </table>

    <!-- QR CODE -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="padding:20px 0;text-align:center;">
        <div style="display:inline-block;padding:12px;border:2px solid #6d28d9;border-radius:16px;background:#ffffff;">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=C2BE1B83B7951911" alt="QR Code" width="180" height="180" style="display:block;width:180px;height:180px;" />
        </div>
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-top:12px;">
          <tr>
            <td style="border-top:1px solid #d4d4d8;"></td>
            <td style="padding:0 12px;font-size:11px;font-weight:700;color:#6d28d9;text-transform:uppercase;letter-spacing:1.5px;white-space:nowrap;">Scan at Entrance</td>
            <td style="border-top:1px solid #d4d4d8;"></td>
          </tr>
        </table>
      </td></tr>
    </table>

    <!-- DIVIDER -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="border-top:2px dashed #d4d4d8;"></td></tr>
    </table>

    <!-- BOOKING ID -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="padding:16px 0;text-align:center;">
        <div style="font-size:11px;font-weight:700;color:#6d28d9;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;">Booking ID</div>
        <div style="display:inline-block;border:1.5px solid #d4d4d8;border-radius:8px;padding:8px 20px;">
          <span style="font-size:16px;font-weight:800;color:#18181b;letter-spacing:3px;font-family:'Courier New',monospace;">C2BE1B83B7951911</span>
        </div>
      </td></tr>
    </table>

    <!-- DIVIDER -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="border-top:2px dashed #d4d4d8;"></td></tr>
    </table>

    <!-- PRICE SECTION -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr><td style="padding:16px 0 20px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#f5f3ff;border-radius:12px;padding:14px 20px;">
          <tr>
            <td style="padding:0 0 10px;font-size:14px;font-weight:700;color:#18181b;">1 Ticket</td>
            <td style="text-align:right;padding:0 0 10px;font-size:14px;font-weight:700;color:#18181b;">€25.00</td>
          </tr>
          <tr><td colspan="2" style="padding:0 0 10px;"><div style="border-top:1px solid #d4d4d8;"></div></td></tr>
          <tr>
            <td>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="width:18px;height:18px;background:#16a34a;border-radius:50%;text-align:center;font-size:11px;color:#fff;font-weight:bold;line-height:18px;">&#10003;</td>
                  <td style="padding-left:6px;font-size:13px;font-weight:700;color:#16a34a;">PAID</td>
                </tr>
              </table>
            </td>
            <td></td>
          </tr>
        </table>
      </td></tr>
    </table>

  </td></tr>

  <!-- DARK FOOTER -->
  <tr><td style="padding:18px 24px 20px;background:#1e1b4b;border-radius:0 0 20px 20px;text-align:center;">
    <div style="margin-bottom:6px;"><img src="../Tixpass logo.png" alt="TixPass" width="60" height="60" style="display:inline-block;border-radius:8px;" /></div>
    <div style="font-size:12px;color:#a1a1aa;font-style:italic;">Your ticket. Your experience.</div>
  </td></tr>

</table>
</body>
</html>
